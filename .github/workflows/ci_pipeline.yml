name: Python CI Pipeline - Gorent (Sistem Rental Kendaraan)

# Pipeline berjalan otomatis saat ada push atau pull request ke branch main
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Mengambil Kode dari Repositori (Checkout)
        uses: actions/checkout@v4

      - name: 2. Menyiapkan Lingkungan Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: 3. Menginstal Dependensi Sistem (Tkinter dan Xvfb untuk test tampilan)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb python3-tk

      - name: 4. Menginstal Dependensi Proyek
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: 5. Menjalankan Pemeriksaan Kualitas Kode (Flake8)
        run: flake8 config/ models/ controllers/ views/ main.py --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: 6. Menjalankan Automated Unit Testing (Pytest)
        # xvfb-run menyediakan layar virtual agar test tampilan (customtkinter)
        # ikut berjalan dan tidak dilewati (skipped)
        run: xvfb-run -a python -m pytest test/ -v